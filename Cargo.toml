[package]
name = "pkgq"
version = "0.1.0"
edition = "2021"
description = "Inventory and search OS applications across package managers, outputting JSON"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
