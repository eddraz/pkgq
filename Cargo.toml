[package]
name = "pkgq"
version = "0.2.0"
edition = "2021"
description = "Inventory and search OS applications across package managers (apt, dpkg, flatpak, snap, brew, pacman, dnf) as JSON"
license = "MIT"
repository = "https://github.com/eddraz/pkgq"
homepage = "https://github.com/eddraz/pkgq"
readme = "README.md"
keywords = ["cli", "packages", "inventory", "apt", "flatpak"]
categories = ["command-line-utilities", "os"]
exclude = ["odd", ".github", ".serena", ".codegraph", ".atl"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native in-process embedding engine (candle + HF ecosystem).
# CPU-only, no CUDA/Metal features.
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
# `tokenizers` without the default `onig` C regex backend; `fancy-regex` is pure Rust.
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }


[profile.release]
lto = true
strip = true
