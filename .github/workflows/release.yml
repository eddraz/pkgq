name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact existing tag to build (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch builds always check out the remote tag, never a branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Derive version from tag
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ref="${{ inputs.tag }}"
          fi
          echo "VERSION=${ref#v}" >> "$GITHUB_ENV"

      - name: Install cross linker (linux-aarch64)
        if: matrix.apt_packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}

      - name: Package (tar.gz)
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "../../../pkgq-$VERSION-${{ matrix.target }}.tar.gz" pkgq

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # $VERSION is a GITHUB_ENV variable: `with:` inputs are not
          # shell-expanded, so the version must be interpolated as an
          # Actions expression or the glob matches nothing and the
          # release ships without assets (fail_on_unmatched_files
          # guards against that ever being silent again).
          files: pkgq-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          # On workflow_dispatch GITHUB_REF_NAME is the branch, not the tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
