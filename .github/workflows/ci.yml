name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian (apt/dpkg)
            os: ubuntu-latest
            expected: apt
          - name: macos (brew)
            os: macos-latest
            expected: brew
    env:
      EXPECTED_MANAGER: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@v4

      - name: Format check
        run: cargo fmt --check

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test

      # Network commands (search/outdated) are user-triggered only; CI keeps
      # to the local inventory smoke so runs stay fast and deterministic.
      - name: "Smoke: inventory detects the platform package manager"
        run: |
          ./target/release/pkgq list --compact > inventory.json
          jq -e '.count > 0' inventory.json
          jq -e --arg m "$EXPECTED_MANAGER" '.managers_detected | index($m) != null' inventory.json
          echo "detected: $(jq -c '.managers_detected' inventory.json)"

  containers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch (pacman)
            image: archlinux:base-devel
            install: pacman -Syu --noconfirm git rust jq
            expected: pacman
          - name: fedora (dnf/rpm)
            image: fedora:latest
            install: dnf install -y git cargo jq
            expected: dnf
    env:
      EXPECTED_MANAGER: ${{ matrix.expected }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: ${{ matrix.install }}

      - name: Build (release)
        run: cargo build --release

      - name: Unit tests
        run: cargo test

      - name: "Smoke: inventory detects the platform package manager"
        run: |
          ./target/release/pkgq list --compact > inventory.json
          jq -e '.count > 0' inventory.json
          jq -e --arg m "$EXPECTED_MANAGER" '.managers_detected | index($m) != null' inventory.json
          echo "detected: $(jq -c '.managers_detected' inventory.json)"
